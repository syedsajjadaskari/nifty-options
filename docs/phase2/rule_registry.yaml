- rule_id: ENTRY-CUTOFF-001
  strategy: EXEC
  method: ALL
  description: '1:00 PM IST is the strict entry cutoff: no new position may be entered with a fill later than 13:00:00 IST. A candle that closes
    after 13:00 is not an eligible entry. With the causal fill convention (the open of the bar starting at the signal candle''s end) a signal
    confirmed at exactly 13:00 fills at 13:00:00 and is eligible; one confirmed at 13:05 is rejected as ENTRY_CUTOFF_EXCEEDED. The cutoff concerns
