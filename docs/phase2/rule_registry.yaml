# GENERATED by scripts/phase2_build_docs.py from src/nifty_trading/strategies/rule_data.py - do not edit by hand
registry_name: NIFTY 50 Phase 2 rule registry
scope: NIFTY 50 index-price signals only. No options, no orders, no live execution. All point P&L is synthetic.
classification_vocabulary:
  VERIFIED_EXPLICIT: directly stated and objectively testable
  VERIFIED_QUALITATIVE: directly stated but needs a mathematical interpretation
  CONFLICTING: different sections give incompatible instructions
  UNRESOLVED: necessary information not provided (was MISSING)
  PROPOSED_FOR_REVIEW: engineering interpretation, NOT an original rule (was PROPOSED)
  USER_APPROVED: 'authorised by the strategy owner (Phase 2.2: stop-loss research baseline only)'
unresolved_flags:
  RF_TARGET_STATUS: PROPOSED_FOR_REVIEW
  RF_STOP_SELECTION: SOURCE UNRESOLVED; research baseline 35 USER_APPROVED (EXE-STOP-001)
  PDR_STOP_SELECTION: SOURCE UNRESOLVED; research baseline 35 USER_APPROVED (EXE-STOP-001)
  TARGET2_ASSIGNMENT_PER_STRATEGY: guide values configured (IRF 60, ORB 60, PDR 70, PDS 70); RF 60 PROPOSED_FOR_REVIEW; PDR/PDS guide-vs-report
    conflict recorded
source_constants_stated_in_documents:
  irf_target_points: 60.0
  irf_stop_choices: &id001
  - 35.0
  - 40.0
  orb_stop_points: 30.0
  orb_target_points: 60.0
  pdr_target_points: 70.0
  pds_target_points: 70.0
  pdr_pds_stop_choices: *id001
  rf_stop_range: *id001
  rf_target_points: null
  t1_points: 27.0
  lots_total: 6
  lot_size: 65
  t2_choices:
  - 60.0
  - 70.0
proposal_candidates:
  strong_candle:
    STRICT: body>=70% of range, opposite wick<=15%
    MODERATE: body>=60%, opposite wick<=20%
    LOOSE: body>=50%, opposite wick<=25%
  pin_bar:
    STRICT: wick>=70%, body<=25%, opposite wick<=10%
    MODERATE: wick>=60%, body<=33%, opp<=15%
    LOOSE: wick>=55%, body<=40%, opp<=20%
    OWNER_2X_CLOSE30: rejection wick >= 2x body and close within the favourable 30% of the range (owner recommendation)
  rejection_wick:
    STRICT: wick>=25% of range
    MODERATE: wick>=33%
    LOOSE: wick>=40%
  trend_mode:
    EMA5M_BASIC: close of the first 5m candle vs EMA(200) of completed 5m closes (the 'basic filter' only)
    EMA5M_PREV_SESSION: BASIC + previous session's last 5m close already on the trend side of its EMA (encodes RF p.5 invalid example)
    EMA5M_PREV_3_SESSIONS: BASIC + each of the previous 3 sessions closed on the trend side of its EMA
    SMA200_DAILY: first-candle close vs SMA(200) of daily official closes up to the previous session (needs 200 prior daily bars)
    EMA200_DAILY: as SMA200_DAILY but exponential
    EMA_PREV_SESSION_CLOSE: 'VARIANT A (owner-approved research variant): PREVIOUS-session only - its last 5m close vs its own EMA(200); no swing
      structure'
    STRUCTURE_EMA_SWING2: 'VARIANT B (owner-approved research variant): PREVIOUS-session only: last close vs its EMA(200) AND the last two confirmed
      swing highs AND the last two swing lows rising (up) / falling (down); swing = strictly beyond 2 candles each side'
  irf_support_def:
    SWING_K1: latest 3-candle fractal low confirmed before the signal candle
    SWING_K2: latest 5-candle fractal low (2 each side)
    LAST_N3: lowest low of the 3 candles immediately before the signal candle
  irf_resistance_def:
    FIRST_PUSH_TOP: earliest 3-candle fractal high at/after the breakout candle
    LATEST_SWING_HIGH: latest confirmed 3-candle fractal high after the breakout candle
  m2b_push_must_precede_red_candle:
    'False': the candle that closes back below resistance may itself be the one that traded above it
    'True': a EARLIER candle must have traded back above the resistance
  m2_extension_definition:
    E1: a later candle makes a higher high than the breakout candle
    E2: a later candle also closes above IRH
  m3_compression_def:
    C1: previous N candles lie fully inside [IRL, IRH]
    C2: C1 and every one of them has range <= 50% of the initial-range height
    C3: C1 and every one of them is a small candle (body <= 30% of its range)
  m3_wick_share_band:
    BAND_60_70: 0.60 <= share <= 0.70 (literal)
    MIN_60: share >= 0.60
    BAND_55_75: 0.55 <= share <= 0.75
  stop_distance_measure:
    GREEN_HIGH: distance = high of the most recent green candle - entry (short)
    GREEN_CLOSE: distance = close of the most recent green candle - entry (short)
    GREEN_SETUP_HIGH: distance = highest high among green candles since the setup began - entry
  pdr_open_vs_zone:
    ABOVE_ZONE: open > zone high (the guide's text; default)
    NOT_BELOW_ZONE: open >= zone low (price at/above the zone, so it can act as support)
    ANY: 'no condition on the open beyond the gap-up (55% of its signals open BELOW the zone: not recommended)'
  pds_open_vs_zone:
    BELOW_ZONE: open < zone low (the guide's text, p.3; default)
    NOT_ABOVE_ZONE: open <= zone high
    ANY: no condition beyond the gap-down
  prev_close_source:
    OFFICIAL_DAILY: previous close = the vendor daily close = the published NSE closing value (verified on 9 of 9 external closes)
    LAST_PRINT_1530: previous close = the last 1-minute print at 15:30 (equal to the official close only from 2026-08-03)
  prev_day_level_window:
    ALL_CANDLES: previous-day high/low/zone use every complete 5m candle, as a chart shows them (default)
    CONTINUOUS_ONLY: on closing-auction days (>= 2026-08-03) use only candles that ended by 15:15
  zone_lower_boundary:
    ZONE_FULL: PDR zone = [body bottom, wick top] (mirrors PDS text 'body and wick')
    ZONE_WICK: PDR zone = [body top, wick top] (wick only)
  zone_proximity_points:
    '0': actual zone intersection (strict research version)
    '5': within 5 index points (near-touch proposal)
    '10': within 10 index points
  pdr_zone_method:
    A_HIGHEST_HIGH: 'DIAGNOSTIC REFERENCE ONLY (Phase 2.3): the previous session''s absolute highest-high candle; signals built on it are marked
      DIAGNOSTIC_ONLY_NOT_TRADABLE'
    B_SWING_HIGH_REVERSAL: 'owner-approved research candidate 1 (confirmed reversal swing high): the LATEST confirmed swing high (swing_k each
      side) with a red candle at/after the peak; no such swing = no PDR setup'
    C_REPEATED_TOUCHES: 'owner-approved research candidate 2 (repeated resistance shelf): the highest cluster of >=2 confirmed swing highs within
      the tolerance; the zone spans the cluster; no cluster = no PDR setup'
  pds_zone_method:
    A_LOWEST_LOW: the previous session's absolute lowest-low candle
    B_SWING_LOW_REVERSAL: the LATEST confirmed swing low with a green candle at/after the trough (bullish reversal)
    C_REPEATED_TOUCHES: the lowest cluster of >=2 confirmed swing lows within the tolerance; zone spans the cluster
  pds_zone_upper_boundary:
    ZONE_FULL: PDS zone = [wick tip, body TOP]
    ZONE_WICK: PDS zone = [wick tip, body BOTTOM] (wick only)
  rf_return_inside_def:
    R1: first later candle that CLOSES back inside [RF_L, RF_H]
    R2: first later candle whose range touches RF_L (High >= RF_L)
    R3: only the very next candle after the close-below, closing inside
  pds_small_support_def:
    SWING_K1_NEAR_ZONE: fractal low formed after the weak red candle within the zone band
    LAST_N2: lowest low of the 2 candles before the signal candle
  pds_m3_break_basis:
    CLOSE: a candle CLOSES below the small support
    TOUCH: a candle's low trades below it
  orb_prev_day_level_def:
    PREV_DAY_HL: previous session high (resistance) / low (support)
proposal_label: PROPOSED_FOR_REVIEW
